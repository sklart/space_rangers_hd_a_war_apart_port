name: package-host

on:
  push:
  pull_request:

concurrency:
  group: package-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libpng-dev libjpeg-dev cmake
      - name: Validate Switch NRO icon
        run: python3 tools/validate-switch-icon.py port/switch/assets/icon.jpg
      - name: Build and run asset-free corrupt package regression
        run: |
          mkdir -p build port/switch/build
          startup_sources="port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp port/switch/platform/sysutils_imports_portable.cpp port/switch/platform/runtime_time.cpp port/switch/platform/runtime_failure_hooks_portable.cpp upstream/cpp/src/CrcUnit.cpp upstream/cpp/src/BlockParException.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/src/EC_Buf.cpp upstream/cpp/src/EC_BlockPar.cpp upstream/cpp/src/EC_Str.cpp upstream/cpp/src/EC_Mem.cpp upstream/cpp/src/aPacket.cpp upstream/cpp/src/GR_Main.cpp upstream/cpp/runtime/runtime.cpp"
          platform_startup_sources="$startup_sources port/switch/platform/runtime_platform.cpp port/switch/platform/startup_slice.cpp upstream/cpp/src/MessageText.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform tests/test_corrupt_package.cpp port/switch/platform/package.cpp -lz -o port/switch/build/test_corrupt_package
          port/switch/build/test_corrupt_package
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform tests/test_package_cycles.cpp port/switch/platform/package.cpp -lz -o port/switch/build/test_package_cycles
          port/switch/build/test_package_cycles
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_ec_file_synthetic.cpp port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/runtime/runtime.cpp -lz -o port/switch/build/test_ec_file_synthetic
          port/switch/build/test_ec_file_synthetic
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_user_writable.cpp port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/runtime/runtime.cpp -lz -o port/switch/build/test_user_writable
          port/switch/build/test_user_writable port/switch/build/m9-user-root
          g++ -std=c++20 -Wall -Wextra -Wpedantic -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_blockpar_synthetic.cpp $startup_sources -Wl,--gc-sections -lz -o port/switch/build/test_blockpar_synthetic
          port/switch/build/test_blockpar_synthetic
          git -C upstream/cpp apply ../../port/switch/platform/gr_main_portable.patch
          git -C upstream/cpp apply --ignore-space-change ../../port/switch/platform/gr_main_zlib_portable.patch
          git -C upstream/cpp apply ../../port/switch/platform/dat_zlib_guard.patch
          dat_sources="port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp port/switch/platform/sysutils_imports_portable.cpp port/switch/platform/runtime_time.cpp port/switch/platform/runtime_failure_hooks_portable.cpp port/switch/platform/runtime_settings_slice.cpp port/switch/platform/ui_metadata_slice.cpp port/switch/platform/zlib_bridge.cpp upstream/cpp/src/CrcUnit.cpp upstream/cpp/src/System.cpp upstream/cpp/src/SystemImports.cpp upstream/cpp/src/BlockParException.cpp upstream/cpp/src/GI_Main.cpp upstream/cpp/src/GlobalsV.cpp upstream/cpp/src/aMyFunction.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/src/EC_Buf.cpp upstream/cpp/src/EC_Cache.cpp upstream/cpp/src/EC_BlockPar.cpp upstream/cpp/src/EC_Data.cpp upstream/cpp/src/EC_Str.cpp upstream/cpp/src/EC_Mem.cpp upstream/cpp/src/aPacket.cpp upstream/cpp/src/MessageText.cpp upstream/cpp/src/GR_GraphBuf.cpp upstream/cpp/src/GR_Main.cpp upstream/cpp/runtime/runtime.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -DSRHD_PORTABLE_RENDERER -DSRHD_PORTABLE_RUNTIME_SLICE -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_dat_synthetic.cpp $dat_sources -Wl,--gc-sections -lz -o port/switch/build/test_dat_synthetic
          port/switch/build/test_dat_synthetic
          git -C upstream/cpp apply -R ../../port/switch/platform/dat_zlib_guard.patch
          git -C upstream/cpp apply -R --ignore-space-change ../../port/switch/platform/gr_main_zlib_portable.patch
          git -C upstream/cpp apply -R --ignore-space-change ../../port/switch/platform/gr_main_portable.patch
          g++ -std=c++20 -Wall -Wextra -Wpedantic -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_gr_main_no_mod_startup.cpp $startup_sources -Wl,--gc-sections -lz -o port/switch/build/test_gr_main_no_mod_startup
          port/switch/build/test_gr_main_no_mod_startup
          g++ -std=c++20 -Wall -Wextra -Wpedantic -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_gr_main_config_startup.cpp $startup_sources -Wl,--gc-sections -lz -o port/switch/build/test_gr_main_config_startup
          port/switch/build/test_gr_main_config_startup
          g++ -std=c++20 -Wall -Wextra -Wpedantic -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_platform_startup.cpp $platform_startup_sources -Wl,--gc-sections -lz -o port/switch/build/test_platform_startup
          port/switch/build/test_platform_startup
          git -C upstream/cpp apply ../../port/switch/platform/gr_main_portable.patch
          mkdir -p port/switch/build/host-renderer
          for source in pixels copy alpha_buffers gradients; do
            gcc -std=c11 -Iupstream/okgf/include -Iupstream/okgf/src -c "upstream/okgf/src/$source.c" -o "port/switch/build/host-renderer/$source.o"
          done
          gcc -std=c11 -Iupstream/okgf/include -Iupstream/okgf/src -c upstream/okgf/src/math/precision.c -o port/switch/build/host-renderer/precision.o
          g++ -std=c++20 -Wall -Wextra -Wpedantic -DSRHD_PORTABLE_RENDERER -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime -Iupstream/okgf/include tests/test_renderer_software.cpp port/switch/platform/okgf_bridge.cpp port/switch/platform/renderer_platform.cpp port/switch/platform/runtime_time.cpp port/switch/platform/runtime_failure_hooks_portable.cpp port/switch/platform/windows_imports_portable.cpp upstream/cpp/src/System.cpp upstream/cpp/src/SystemImports.cpp upstream/cpp/src/GlobalsV.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/src/EC_Mem.cpp upstream/cpp/src/GR_GraphBuf.cpp upstream/cpp/src/GR_Main.cpp upstream/cpp/runtime/runtime.cpp port/switch/build/host-renderer/pixels.o port/switch/build/host-renderer/copy.o port/switch/build/host-renderer/alpha_buffers.o port/switch/build/host-renderer/gradients.o port/switch/build/host-renderer/precision.o -Wl,--gc-sections -lm -o port/switch/build/test_renderer_software
          echo renderer-build-pass
          port/switch/build/test_renderer_software
          git -C upstream/cpp apply -R --ignore-space-change ../../port/switch/platform/gr_main_portable.patch
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform tests/test_zl02_synthetic.cpp port/switch/platform/package.cpp -lz -o port/switch/build/test_zl02_synthetic
          port/switch/build/test_zl02_synthetic
      - name: Run M12 runtime loop regression
        run: make -C port/switch host-runtime-loop-test
      - name: Run M13 bitmap cache regression
        run: make -C port/switch host-bitmap-cache-test
      - name: Run M14P GI Format-0 CPU regression
        run: make -C port/switch host-gi-format0-cpu-test

      - name: Run M15 GAI CPU regression
        run: make -C port/switch host-gai-cpu-test

      - name: Run M16 GI Format-2 CPU regression
        run: make -C port/switch host-gi-format2-cpu-test

      - name: Run M17 GAI sequence parser regression
        run: make -C port/switch host-gai-sequence-cpu-test

      - name: Run M17 GAI playback timing regression
        run: make -C port/switch host-gai-playback-cpu-test

      - name: Audit M17 CPU symbols
        shell: bash
        run: |
          set -euo pipefail
          forbidden='GR_DX|Direct3D|IDirect3DTexture9|TGraphBufGR|TgiGR|TCGiEC|TCGaiEC|GI_GAIFile|GI_GAI|GI_MessageLoop|SoundManager'
          for binary in port/switch/build/test_gai_sequence_cpu port/switch/build/test_gai_playback_cpu; do
            test -x "$binary"
            ! nm -C "$binary" | grep -E "$forbidden"
          done

      - name: Run M18 software compositor regression
        run: make -C port/switch host-software-compositor-test

      - name: Audit M18 CPU symbols
        shell: bash
        run: |
          set -euo pipefail
          binary=port/switch/build/test_software_compositor
          test -x "$binary"
          ! nm -C "$binary" | grep -E 'GR_DX|Direct3D|TGraphBufGR|TgiGR|TCGiEC|TCGaiEC|GI_GAI'

      - name: Run M19 scene compositor regression
        run: make -C port/switch host-scene-compositor-test

      - name: Audit M19 CPU symbols
        shell: bash
        run: |
          set -euo pipefail
          binary=port/switch/build/test_scene_compositor
          test -x "$binary"
          ! nm -C "$binary" | grep -E 'GR_DX|Direct3D|TGraphBufGR|TgiGR|TCGiEC|TCGaiEC|GI_GAI|Forms'

      - name: Run M20 GI object regression
        run: make -C port/switch host-gi-object-test

      - name: Audit M20 CPU symbols
        shell: bash
        run: |
          set -euo pipefail
          binary=port/switch/build/test_gi_object
          test -x "$binary"
          ! nm -C "$binary" | grep -E 'GR_DX|Direct3D|TGraphBufGR|TgiGR|TCGiEC|TCGaiEC|GI_GAI|Forms'

      - name: Run M21 Portable UI Image Foundation regression
        run: make -C port/switch host-m21-ui-image-regression

      - name: Run M22 Portable UI Object/Layout Foundation regression
        run: make -C port/switch host-m22-ui-regression

      - name: Run M22 UI tree structural oracle
        run: python3 tests/probe_m22_ui_tree.py

      - name: Check M22 release-backed probe syntax
        run: python3 -m py_compile tests/probe_m22_ui_release.py tests/probe_m22_runtime_oracle.py

      - name: Run M23 Portable AFT / Text / Label regression
        run: make -C port/switch host-m23-ui-regression

      - name: Check M23 release probes and occurrence inventory
        run: |
          python3 -m py_compile tests/probe_aft_release.py tests/probe_m23_text_release.py tests/probe_m23_ui_text.py tests/probe_m23_real_label.py
          python3 tests/probe_m23_text_release.py --self-test
          python3 tests/probe_m23_real_label.py --self-test

      - name: Run independent M23 synthetic UI text oracle
        run: python3 tests/probe_m23_ui_text.py

      - name: Audit M23 portable production symbols
        shell: bash
        run: |
          set -euo pipefail
          objects=$(mktemp -d)
          trap 'rm -rf "$objects"' EXIT
          for name in aft_font font_renderer font_repository font_cache_resolver tagged_text ui_label; do
            g++ -std=c++20 -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime -Iupstream/okgf/include \
              -c "port/switch/platform/$name.cpp" -o "$objects/$name.o"
          done
          for object in "$objects"/*.o; do
            ! nm -C "$object" | grep -E 'TCFontEC|TCFontControlEC|GI_Label|TLabelGI|GI_MessageLoop|GR_DX|Direct3D|TGraphBufGR|CreateFont|TextOut|Forms'
          done

      - name: Run M24 Portable GraphButton / Window / Zone regression
        run: make -C port/switch host-m24-ui-regression

      - name: Check M24 probes and independent controls oracle
        run: |
          python3 -m py_compile tests/probe_m24_controls_release.py tests/probe_m24_controls.py
          python3 tests/probe_m24_controls_release.py --self-test
          python3 tests/probe_m24_controls.py

      - name: Audit M24 portable production symbols
        shell: bash
        run: |
          set -euo pipefail
          objects=$(mktemp -d)
          trap 'rm -rf "$objects"' EXIT
          for name in ui_graph_button ui_window ui_zone ui_controls_fingerprint ui_controls_checkpoint; do
            g++ -std=c++20 -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime -Iupstream/okgf/include \
              -c "port/switch/platform/$name.cpp" -o "$objects/$name.o"
          done
          for object in "$objects"/*.o; do
            ! nm -C "$object" | grep -E 'GI_GraphButton|TGraphButtonGI|GI_Window|TWindowGI|GI_Zone|TZoneGI|GI_MessageLoop|GR_DX|Direct3D|TGraphBufGR|Forms|SoundManager'
          done

      - name: Run M21 mixed presentation-scene oracle
        run: python3 tests/probe_m21_presentation_scene.py

      - name: Check M21 release-scene oracle syntax
        run: python3 -m py_compile tests/probe_m21_release_scene.py

      - name: Audit M21 CPU symbols
        shell: bash
        run: |
          set -euo pipefail
          for binary in port/switch/build/test_image_cpu port/switch/build/test_alpha_bitmap_cpu port/switch/build/test_trans_bitmap_cpu port/switch/build/test_simple_bitmap_cpu port/switch/build/test_image_layout port/switch/build/test_image_object port/switch/build/test_m21_presentation_scene; do
            test -x "$binary"
            ! nm -C "$binary" | grep -E 'GR_DX|Direct3D|IDirect3DTexture9|TGraphBufGR|TCBitmapEC|TCTBitmapEC|TCAlphaBitmapEC|TImageGI|TSimpleImageGI|TTransImageGI|TAlphaImageGI|GI_MessageLoop|Forms'
          done

      - name: Audit M16 GI Format-2 CPU symbols
        shell: bash
        run: |
          set -euo pipefail
          binary=port/switch/build/test_gi_format2_cpu
          test -x "$binary"
          ! nm -C "$binary" | grep -E 'GR_DX|Direct3D|IDirect3DTexture9|TGraphBufGR|TgiGR|TCGiEC|TCGaiEC|GI_GAIFile'

      - name: Audit M14P CPU binary symbols
        shell: bash
        run: |
          set -euo pipefail
          binary=port/switch/build/test_gi_format0_cpu
          test -x "$binary"
          forbidden='GR_DX|Direct3D|IDirect3DTexture9|TGraphBufGR|TCGiEC|GetOrCreateSurface|CreateTextureCache|GR_CreateTexture'
          audit() {
            if "$@" "$binary" | grep -E "$forbidden"; then
              echo "forbidden M14P CPU symbol found" >&2
              return 1
            fi
          }
          audit nm -C
          audit readelf -Ws
          audit objdump -t

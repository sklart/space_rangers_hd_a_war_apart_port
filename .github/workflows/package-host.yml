name: package-host

on:
  push:
  pull_request:

concurrency:
  group: package-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e5-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Guard new pointer-width sites
        run: python3 tools/e2e5_static_audit.py --check --output reports/e2e5/pointer-width-audit.json
      - name: Switch artifact staging rejection tests
        run: python3 -m unittest discover -s tests -p test_ci_stage_switch_artifacts.py -v
      - name: E2E-5 tool regressions
        run: python3 -m unittest discover -s tests -p 'test_e2e5_tools.py' -v
      - name: Generation comparison evidence gates
        run: python3 -m unittest discover -s tests -p 'test_e2e5_generation_compare.py' -v
      - name: Report unavailable private assets honestly
        run: python3 tools/e2e5_resource_validator.py --output reports/e2e5/resource-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e5-fast-reports
          path: reports/e2e5/*-audit.json
          if-no-files-found: ignore
  e2e4-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libvorbis-dev libsdl2-dev
      - name: Asset-free audio and protected-state ASan/UBSan
        run: |
          set -euo pipefail
          mkdir -p build/e2e4-sanitizers
          for test in wav vorbis_read protected_state audio_mixer audio_stream ui_cache_key script_value; do
            g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
              -fsanitize=address,undefined -Iport/switch/platform \
              "tests/test_e2e4_${test}.cpp" -o "build/e2e4-sanitizers/${test}"
            "build/e2e4-sanitizers/${test}"
          done
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/test_e2e4_native_vorbis.cpp \
            port/switch/platform/e2e4_native_vorbis.cpp \
            $(pkg-config --cflags --libs vorbisfile) \
            -o build/e2e4-sanitizers/native_vorbis
          build/e2e4-sanitizers/native_vorbis \
            tests/fixtures/e2e4_sine_22050_stereo.ogg
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/test_e2e4_sdl_audio.cpp \
            port/switch/platform/e2e4_sdl_audio.cpp \
            port/switch/platform/e2e4_game_audio_bridge.cpp \
            $(pkg-config --cflags --libs sdl2) -pthread \
            -o build/e2e4-sanitizers/sdl_audio
          build/e2e4-sanitizers/sdl_audio
          g++ -std=gnu++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/test_e2e4_quicksave_transaction.cpp \
            port/switch/platform/e2e4_quicksave_transaction.cpp \
            port/switch/platform/user_root.cpp -lz \
            -o build/e2e4-sanitizers/quicksave_transaction
          build/e2e4-sanitizers/quicksave_transaction \
            build/e2e4-sanitizers/quicksave-test
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/e2e5_pointer_payload_test.cpp -pthread \
            -o build/e2e4-sanitizers/pointer_payload
          build/e2e4-sanitizers/pointer_payload
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/test_e2e5_input_history.cpp \
            port/switch/platform/input_platform.cpp \
            -o build/e2e4-sanitizers/input_history
          build/e2e4-sanitizers/input_history
          python3 tools/e2e515_input_tests.py --sanitize
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/test_e2e59_map_swipe.cpp port/switch/platform/input_platform.cpp \
            -o build/e2e4-sanitizers/map_swipe_index
          build/e2e4-sanitizers/map_swipe_index
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -Iport/switch/platform \
            tests/test_e2e5_cfg_bootstrap.cpp \
            -o build/e2e4-sanitizers/cfg_bootstrap
          build/e2e4-sanitizers/cfg_bootstrap

  e2e5-arm64-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install ARM64 Linux emulator and cross compiler
        run: sudo apt-get update && sudo apt-get install -y qemu-user g++-aarch64-linux-gnu cmake libpng-dev libjpeg-dev
      - name: Effective Switch GI rescale on Linux ARM64 under QEMU
        run: bash tools/e2e5_original_graphbuf_arm64_host.sh --synthetic
      - name: Native script Int storage and signed numeric view on ARM64
        run: |
          mkdir -p build/script-value-arm64
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Iport/switch/platform \
            tests/test_e2e4_script_value.cpp -o build/script-value-arm64/contract
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/script-value-arm64/contract
      - name: Native MatrixGame engine callback API on ARM64
        run: bash tools/matrixgame_engine_api_arm64.sh
      - name: VectorObject submesh ranges on ARM64
        run: |
          mkdir -p build/mg-submesh-arm64
          aarch64-linux-gnu-g++ -std=c++20 -O1 -g tests/test_matrixgame_mesh_submission.cpp \
            -o build/mg-submesh-arm64/contract
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/mg-submesh-arm64/contract
      - name: RGBA8 texture upload layout on ARM64
        run: |
          mkdir -p build/mg-texture-arm64
          aarch64-linux-gnu-g++ -std=c++20 -O1 -g tests/test_matrixgame_texture_upload.cpp \
            -o build/mg-texture-arm64/contract
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/mg-texture-arm64/contract
      - name: Original MatrixLib CRC with Win32 dword width on ARM64
        run: |
          python3 tools/matrixgame_core_prepare.py --output build/mg-core-arm64/source
          aarch64-linux-gnu-g++ -std=c++20 -O2 -g -Ibuild/mg-core-arm64/source \
            tests/test_matrixgame_native_crc.cpp build/mg-core-arm64/source/CRC32.cpp \
            -o build/mg-core-arm64/contract
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/mg-core-arm64/contract
      - name: Original MatrixLib CBuf UTF-16LE on ARM64
        run: |
          aarch64-linux-gnu-g++ -std=c++20 -O2 -g \
            -Ibuild/mg-core-arm64/source -Iport/matrixgame/native-core \
            tests/test_matrixgame_native_buffer.cpp build/mg-core-arm64/source/CBuf.cpp \
            port/matrixgame/native-core/cbuf_utf16.cpp port/matrixgame/native-core/exception_native.cpp \
            -o build/mg-core-arm64/buffer-contract
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/mg-core-arm64/buffer-contract
      - name: Native MatrixLib CFile and bounded package IO on ARM64
        run: bash tools/matrixgame_file_arm64.sh
      - name: Original MatrixLib STRG storage on ARM64
        run: bash tools/matrixgame_file_arm64.sh --storage
      - name: Original MatrixLib BlockPar configuration on ARM64
        run: bash tools/matrixgame_file_arm64.sh --blockpar
      - name: Original MatrixLib Math3D with NEON on ARM64
        run: bash tools/matrixgame_file_arm64.sh --math
      - name: Original MatrixLib Windows-compatible RNG on ARM64
        run: bash tools/matrixgame_file_arm64.sh --random
      - name: Native VectorObject payload and draw order on ARM64
        run: bash tools/matrixgame_file_arm64.sh --vector
      - name: Original resource reminder timing and native lifetime on ARM64
        run: bash tools/matrixgame_file_arm64.sh --reminder
      - name: Native CBitmap PNG pixels and allocation lifetime on ARM64
        run: bash tools/matrixgame_file_arm64.sh --bitmap
      - name: Real DDS and STRG mip formats and GPU staging on ARM64
        run: bash tools/matrixgame_file_arm64.sh --texture
      - name: Original texture sidecar flags and resolved requests on ARM64
        run: bash tools/matrixgame_file_arm64.sh --texture-request
      - name: Exact D3DX PNG gamma and BOX mip controls on ARM64
        run: bash tools/matrixgame_file_arm64.sh --mips
      - name: Native sampler state register contract on ARM64
        run: bash tools/matrixgame_sampler_arm64.sh
      - name: Native raster state register contract on ARM64
        run: bash tools/matrixgame_raster_arm64.sh
      - name: Gesture and bounded film ordinal checks on host and ARM64
        run: python3 tests/probe_e2e59_input_index.py
      - name: Native heap reserve and generation counters on host and ARM64
        run: python3 tests/probe_e2e510_runtime.py
      - name: Exact geometry and pixel length checks on host and ARM64
        run: python3 tests/probe_e2e510_geometry.py

  e2e-full-arm64-link:
    needs: [e2e5-fast, e2e4-sanitizers, e2e5-arm64-host, host-regression]
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Trust checkout paths inside build container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/cpp"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/okgf"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/matrixgame"
      - name: E2E Win32 Compatibility Surface inventory
        run: |
          test -z "$(git -C upstream/cpp status --porcelain)"
          python3 tools/audit_win32_surface.py --self-test
          python3 tools/audit_win32_surface.py --check
      - name: Python generator syntax and import smoke
        run: |
          python3 -m compileall -q tools
          python3 -c 'import sys; sys.path.insert(0, "tools"); import audit_win32_surface, e2e_arm64_build, e2e_source_overrides, e2e4_script_width_overrides, e2e5_host_game_probe'
      - name: Preflight ordinary effective sources and manifest
        run: python3 tools/e2e_arm64_build.py --preflight-only
      - name: Compile full original game and audit Switch dependencies
        run: python3 tools/e2e_arm64_build.py
      - name: Preflight combined effective sources and manifest
        run: python3 tools/e2e_arm64_build.py --experimental-e2e4-combined --preflight-only
      - name: Guard repaired native pointer producers and consumers
        run: python3 tools/e2e59_pointer_audit.py --check --output build/e2e59/pointer-width-audit.json
      - name: Compile one combined E2E-4 experiment
        run: python3 tools/e2e_arm64_build.py --experimental-e2e4-combined
      - name: Preflight experimental Save ON sources and manifest
        run: python3 tools/e2e_arm64_build.py --experimental-e2e4-combined --enable-experimental-saves --preflight-only
      - name: Compile experimental Save ON candidate
        run: python3 tools/e2e_arm64_build.py --experimental-e2e4-combined --enable-experimental-saves
      - name: E2E Win32 Compatibility Surface effective gate
        run: |
          python3 tools/audit_win32_surface.py --effective --build-root port/switch/build/e2e-game --check
          python3 tools/audit_win32_surface.py --effective --build-root port/switch/build/e2e-game-combined-experiment --manifest win32-effective-combined-import-manifest.json --check
          python3 tools/audit_win32_surface.py --effective --build-root port/switch/build/e2e-game-save-test --manifest win32-effective-save-test-import-manifest.json --check
          python3 tools/generate_win32_portable_cases.py --check
      - name: Compile and link native deko3d mesh pass without packaging NRO
        run: python3 tools/matrixgame_deko_build.py
      - name: Build original MatrixLib and native engine callback API with devkitA64
        run: |
          cmake -S port/matrixgame/native -B build/mg-native-switch \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/port/matrixgame/native-core/switch-toolchain.cmake" \
            -DBUILD_TESTING=OFF -DCORE_BUILD_LINK_PROBE=ON -DBRIDGE_BUILD_LINK_PROBE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/mg-native-switch --parallel 2
      - name: Verify pinned upstream remains clean
        if: always()
        run: |
          test -z "$(git -C upstream/cpp status --short)"
          test -z "$(git -C upstream/matrixgame status --short)"
          test -z "$(git -C upstream/okgf status --short)"
      - name: Stage exact Save OFF and Save ON pairs
        run: |
          set -eu
          python3 tools/ci_stage_switch_artifacts.py \
            --report e2e4-combined-build-report.json \
            --out build/ci-stage/save-off \
            --expected-git "$GITHUB_SHA" --save-mode disabled
          python3 tools/ci_stage_switch_artifacts.py \
            --report e2e4-save-test-build-report.json \
            --out build/ci-stage/save-on \
            --expected-git "$GITHUB_SHA" --save-mode experimental
      - name: Publish verified Save OFF diagnostic pair
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: switch-e2e512-save-off-${{ github.sha }}
          path: build/ci-stage/save-off/
          if-no-files-found: error
      - name: Publish verified Save ON test pair
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: switch-e2e512-save-test-v168-${{ github.sha }}
          path: build/ci-stage/save-on/
          if-no-files-found: error

  host-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libpng-dev libjpeg-dev libvorbis-dev cmake libsdl2-dev
      - name: Original GI and buffer decode, rescale, repack with ASan/UBSan
        run: bash tools/e2e5_original_graphbuf_host.sh --synthetic
      - name: Bounded package streaming with ASan/UBSan
        run: python3 tests/probe_package_streaming.py
      - name: Native MatrixGame callbacks with ASan/UBSan and ThreadSanitizer
        run: |
          for sanitizer in address thread; do
            cmake -S port/matrixgame/native -B "build/mg-bridge-$sanitizer" \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBRIDGE_SANITIZER="$sanitizer"
            cmake --build "build/mg-bridge-$sanitizer" --parallel 2
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 TSAN_OPTIONS=halt_on_error=1 \
              ctest --test-dir "build/mg-bridge-$sanitizer" --output-on-failure
          done
      - name: Original MatrixLib CPU contracts with ASan and UBSan
        run: |
          cmake -S port/matrixgame/native-core -B build/mg-core-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCORE_SANITIZERS=ON
          cmake --build build/mg-core-asan --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            ctest --test-dir build/mg-core-asan --output-on-failure
      - name: Native MatrixLib CFile and RNG threads with ThreadSanitizer
        run: |
          cmake -S port/matrixgame/native-core -B build/mg-core-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCORE_THREAD_SANITIZER=ON
          cmake --build build/mg-core-tsan --parallel 2
          TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/mg-core-tsan -R 'file-contract|random-contract' --output-on-failure
      - name: Build complete Linux host for native asset-free regressions
        run: python3 tools/e2e5_host_game_build.py --profile optimized --jobs 2
      - name: Scoped controller ownership and canvas lifecycle in real host objects
        run: python3 tools/e2e515_engine_tests.py
      - name: Original projection math and inline equivalence with ASan and UBSan
        run: python3 tools/e2e515_polygon_tests.py --inline
      - name: Controller message queue ownership with ASan and UBSan
        run: python3 tools/e2e_win32_host_test.py --only window-message-input --sanitize
      - name: Native script pointers, numeric conversions and VM with ASan/UBSan
        run: python3 tests/probe_e2e59_film_history.py --ship-destination
      - name: Native cache failure, raw budget and recovery lifecycle with ASan/UBSan
        run: python3 tests/probe_e2e56_native_cache.py
      - name: Native cache concurrent reclaim with ThreadSanitizer
        run: python3 tests/probe_e2e56_native_cache.py --thread-sanitizer
      - name: Native file-stream OOM and concurrent reader lifecycle with ASan/UBSan
        run: python3 tests/probe_e2e58_file_stream.py
      - name: Validate Switch NRO icon
        run: python3 tools/validate-switch-icon.py port/switch/assets/icon.jpg
      - name: Validate E2E game clock and Sleep
        run: python3 tools/e2e_time_test.py
      - name: Validate E2E synchronization events
        run: make -C port/switch host-e2e-events-test
      - name: Validate E2E worker threads
        run: make -C port/switch host-e2e-threads-test
      - name: Validate E2E-5.11 arcade input and weapon groups
        run: |
          mkdir -p build/e2e511
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iport/switch/platform tests/test_e2e511_arcade_commands.cpp \
            port/switch/platform/input_platform.cpp \
            -o build/e2e511/test_arcade_commands
          build/e2e511/test_arcade_commands
      - name: Validate E2E private heaps
        run: python3 tools/e2e_heap_test.py
      - name: Validate E2E startup calendar
        run: make -C port/switch host-e2e-calendar-test
      - name: E2E Win32 Compatibility Surface host gate
        run: make -C port/switch host-e2e-win32-compat-test
      - name: Concurrent host input publication under ThreadSanitizer
        run: |
          mkdir -p build/input-tsan
          g++ -std=gnu++20 -O1 -g -fsanitize=thread -fno-omit-frame-pointer \
            -include unistd.h -ffunction-sections -fdata-sections -DE2E_HOST_OKGF_STUB \
            -Itests -Iport/switch/platform -Iport/switch/build/e2e-game/runtime-overlay \
            -Iupstream/cpp/src -Iupstream/cpp/runtime \
            tests/test_win32_compat_messages.cpp \
            port/switch/platform/win32_compat_messages.cpp \
            port/switch/platform/win32_compat_window.cpp \
            port/switch/platform/win32_handles.cpp \
            port/switch/platform/e2e_events.cpp port/switch/platform/input_platform.cpp \
            -Wl,--gc-sections -pthread -o build/input-tsan/messages
          TSAN_OPTIONS=halt_on_error=1 build/input-tsan/messages
      - name: E2E-3 original New Game preflight
        run: make -C port/switch host-e2e3-new-game-preflight-test
      - name: E2E-4 RIFF/WAVE PCM parser
        run: make -C port/switch host-e2e4-wav-test
      - name: E2E-4 bounded Vorbis PCM reads
        run: make -C port/switch host-e2e4-vorbis-read-test
      - name: E2E-4 native Vorbis stream
        run: make -C port/switch host-e2e4-native-vorbis-test
      - name: E2E-4 protected-state pointer ranges
        run: make -C port/switch host-e2e4-protected-state-test
      - name: E2E-4 save replacement failure paths
        run: make -C port/switch host-e2e4-save-replace-test
      - name: E2E-4 recoverable quicksave transaction
        run: make -C port/switch host-e2e4-quicksave-transaction-test
      - name: E2E-4 PCM mixer
        run: make -C port/switch host-e2e4-audio-mixer-test
      - name: E2E-4 streaming PCM ring
        run: make -C port/switch host-e2e4-audio-stream-test
      - name: E2E-4 script UI cache key
        run: make -C port/switch host-e2e4-ui-cache-test
      - name: E2E-5 GAI bounds and pointer slots
        run: make -C port/switch host-e2e5-gai-bounds-test host-e2e5-gai-slots-test
      - name: E2E-5 UI progress visibility across threads
        run: make -C port/switch host-e2e5-ui-progress-test
      - name: E2E-4 log analyzer contract
        run: python3 tools/e2e4_log_analyzer.py --self-test
      - name: Validate E2E startup command line
        run: make -C port/switch host-e2e-command-line-test
      - name: Validate E2E install language search
        run: make -C port/switch host-e2e-file-search-test
      - name: Build and run asset-free corrupt package regression
        run: |
          mkdir -p build port/switch/build
          startup_sources="port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp port/switch/platform/sysutils_imports_portable.cpp port/switch/platform/runtime_time.cpp port/switch/platform/runtime_failure_hooks_portable.cpp upstream/cpp/src/CrcUnit.cpp upstream/cpp/src/BlockParException.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/src/EC_Buf.cpp upstream/cpp/src/EC_BlockPar.cpp upstream/cpp/src/EC_Str.cpp upstream/cpp/src/EC_Mem.cpp upstream/cpp/src/aPacket.cpp upstream/cpp/src/GR_Main.cpp upstream/cpp/runtime/runtime.cpp"
          platform_startup_sources="$startup_sources port/switch/platform/runtime_platform.cpp port/switch/platform/startup_slice.cpp upstream/cpp/src/MessageText.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform tests/test_corrupt_package.cpp port/switch/platform/package.cpp -lz -o port/switch/build/test_corrupt_package
          port/switch/build/test_corrupt_package
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform tests/test_package_cycles.cpp port/switch/platform/package.cpp -lz -o port/switch/build/test_package_cycles
          port/switch/build/test_package_cycles
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_ec_file_synthetic.cpp port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/runtime/runtime.cpp -lz -o port/switch/build/test_ec_file_synthetic
          port/switch/build/test_ec_file_synthetic
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_user_writable.cpp port/switch/platform/package.cpp port/switch/platform/game_path.cpp port/switch/platform/user_root.cpp port/switch/platform/ec_file_adapter.cpp port/switch/platform/windows_imports_portable.cpp upstream/cpp/src/EC_File.cpp upstream/cpp/src/EC_Struct.cpp upstream/cpp/runtime/runtime.cpp -lz -o port/switch/build/test_user_writable
          port/switch/build/test_user_writable port/switch/build/m9-user-root
          g++ -std=c++20 -Wall -Wextra -Wpedantic -ffunction-sections -fdata-sections -Iport/switch/platform -Iupstream/cpp/src -Iupstream/cpp/runtime tests/test_blockpar_synthetic.cpp $startup_sources -Wl,--gc-sections -lz -o port/switch/build/test_blockpar_synthetic
          port/switch/build/test_blockpar_synthetic
          patched_dir=port/switch/build/host-patched-upstream/src
          mkdir -p "$patched_dir"
          cp upstream/cpp/src/{GR_Main,EC_BlockPar,EC_Data}.cpp "$patched_dir/"
          git apply --directory=port/switch/build/host-patched-upstream --ignore-space-change port/switch/platform/gr_main_portable.patch
          git apply --directory=port/switch/build/host-patched-upstream --ignore-space-change port/switch/platform/gr_main_zlib_portable.patch
          git apply --directory=port/switch/build/host-patched-upstream --ignore-space-change port/switch/platform/dat_zlib_guard.patch
